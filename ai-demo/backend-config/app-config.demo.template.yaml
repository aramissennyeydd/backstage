catalog:
  rules:
    - allow:
        [
          AiResource,
          Component,
          API,
          Resource,
          System,
          Domain,
          Location,
          User,
          Group,
        ]
  locations:
    - type: file
      target: '@@DEMO@@/backend-config/catalog-demo.yaml'
auth:
  experimentalRefreshToken:
    enabled: true
  providers:
    guest:
      userEntityRef: user:default/demo-user
app:
  baseUrl: http://localhost:3100
  listen:
    port: 3100
backend:
  cors:
    origin: http://localhost:3100
  baseUrl: http://localhost:7107
  actions:
    pluginSources:
      - catalog
      - search
      - techdocs
  listen:
    port: 7107
  # Persist all plugin databases (auth signing keys, sessions, refresh tokens) so a CLI login
  # survives backend restarts. Delete the db directory to reset.
  database:
    client: better-sqlite3
    connection:
      directory: '@@DEMO@@/db'
# Gateway runbook TechDocs: generated by setup.sh (builder external), served from a local publisher.
techdocs:
  builder: external
  publisher:
    type: local
    local:
      publishDirectory: '@@DEMO@@/techdocs-site'
mcpActions:
  servers:
    backstage:
      name: backstage
      description: Read-only Backstage catalog, search and TechDocs
      instructions: Look up API entities and the owning Group in the catalog, and search TechDocs for runbooks.
      filter:
        include:
          - id: 'catalog:get-catalog-entity'
          - id: 'catalog:query-catalog-entities'
          - id: 'search:query'
          - id: 'techdocs:get-techdocs-metadata'
# The search index is in memory and rebuilt on every start, so index quickly and often.
search:
  collators:
    techdocs:
      schedule:
        frequency: { seconds: 30 }
        timeout: { minutes: 2 }
        initialDelay: { seconds: 10 }
    catalog:
      schedule:
        frequency: { seconds: 30 }
        timeout: { minutes: 2 }
        initialDelay: { seconds: 5 }
